<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShredSafe</title>
    <script>
      // Online the site is built with relative asset paths (npm run online: --base ./). Opened as /ports/5174
      // without the trailing slash, "./assets/…" resolves to /ports/assets/…, nothing loads and the page stays
      // black. Add the slash before anything else runs.
      if (/^\/ports\/\d+$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash)
      // The home page opens on a dark stage: paint it dark before the app loads, so there's no white flash.
      else if (/^\/(ports\/\d+\/?)?$/.test(location.pathname)) document.documentElement.style.background = '#030405'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
