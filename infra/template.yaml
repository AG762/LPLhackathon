AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ShredSafe hackathon stack (S3, Lambda, DynamoDB; Bedrock + Macie via IAM)

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin allowed by CORS (Vite dev server by default)
  QuarantineDays:
    Type: Number
    Default: 1
    Description: Grace period before quarantined files are purged (short for the demo)
  DemoControls:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enables POST /audit/demo/tamper and /restore for rehearsing the tamper demo. The Function URL has no auth, so turn this on only for the demo stack (see samconfig.toml).
  FrontendBasePath:
    Type: String
    Default: /
    Description: Path the app is served under, e.g. /ports/5173/ in the online VS Code. With FrontendOrigin it forms the sign-in redirect URL, which Cognito matches exactly.
  AuthRequired:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, every API call needs a Cognito sign-in token (docs/login.md). Off keeps the demo advisor and accepts tokens if sent.
  AllowSignUp:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Anyone can create an account on the sign-in page (independent advisors). New accounts become advisors and see only their own files. false = invite-only (scripts/create_user.py).

  NotifyFrom:
    Type: String
    Description: Sender for "your files are scanned" emails (D.9). Empty turns the emails off. Must be verified in SES.
    Default: ""
  NotifyFallbackTo:
    Type: String
    Description: Who hears about files uploaded without sign-in (the demo). Empty sends those to nobody.
    Default: ""
Conditions:
  SignUpAllowed: !Equals [!Ref AllowSignUp, "true"]
  NotifyOn: !Not [!Equals [!Ref NotifyFrom, ""]]
  FrontendIsLocalhost: !Equals [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512

Resources:
  # ---------- Storage ----------

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Built from a string (not !Ref'd by the functions) so the S3 -> process
      # trigger doesn't create a circular dependency.
      BucketName: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
      # Object Lock can only be turned on when the bucket is created, and it
      # requires versioning. No default retention: records/ objects get
      # per-object retention when they are locked (STORIES.md D.7).
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Grace period: quarantined files expire, then their old versions are removed.
          - Id: purge-quarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: !Ref QuarantineDays
            NoncurrentVersionExpirationInDays: 1
          # Versioning keeps a hidden copy when a file is "moved" (copy + delete)
          # out of uploads/. Remove those copies so deletion is real.
          - Id: purge-old-upload-versions
            Status: Enabled
            Prefix: uploads/
            NoncurrentVersionExpirationInDays: 1
          - Id: cleanup-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: fileId, AttributeType: S }]
      KeySchema: [{ AttributeName: fileId, KeyType: HASH }]

  RetentionRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: docType, AttributeType: S }]
      KeySchema: [{ AttributeName: docType, KeyType: HASH }]

  LegalHoldsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: holdId, AttributeType: S }]
      KeySchema: [{ AttributeName: holdId, KeyType: HASH }]

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: seq, AttributeType: N }]
      KeySchema: [{ AttributeName: seq, KeyType: HASH }]

  # ---------- Functions ----------

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/process
      Handler: handler.process_file_event
      Timeout: 120 # Bedrock reading a multi-page PDF can take a while
      Environment:
        Variables:
          BUCKET_NAME: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LegalHoldsTable }
        - Statement:
            - Effect: Allow
              # If the Bedrock Mantle client is rejected with AccessDenied,
              # check the exact action it needs in the error message and add it here.
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref FilesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/api
      Handler: handler.main
      Environment:
        Variables:
          BUCKET_NAME: !Ref FilesBucket
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
          ACCOUNT_ID: !Ref AWS::AccountId # Macie CreateClassificationJob needs it
          QUARANTINE_DAYS: !Ref QuarantineDays
          DEMO_CONTROLS: !Ref DemoControls
          AUTH_REQUIRED: !Ref AuthRequired
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref WebClient
      Policies:
        - S3CrudPolicy: { BucketName: !Ref FilesBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LegalHoldsTable } # the Admin page places and releases holds (D.8)
        - Statement:
            # Admin page, People tab (D.8): invite, change role, turn access off/on, within the caller's workspace
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - s3:PutObjectRetention # locking files in records/ (D.7)
              Resource: !Sub "${FilesBucket.Arn}/records/*"
            # Purge (D.4) deletes every stored version; S3CrudPolicy only covers the current one.
            # Not records/: locked records stay undeletable.
            - Effect: Allow
              Action:
                - s3:ListBucketVersions
              Resource: !GetAtt FilesBucket.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObjectVersion
              Resource:
                - !Sub "${FilesBucket.Arn}/uploads/*"
                - !Sub "${FilesBucket.Arn}/quarantine/*"
                - !Sub "${FilesBucket.Arn}/restored/*"
            - Effect: Allow
              Action:
                - macie2:CreateClassificationJob
                - macie2:DescribeClassificationJob
                - macie2:ListClassificationJobs
                - macie2:ListFindings
                - macie2:GetFindings
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE # sign-in is checked in code (backend/api/auth.py), see AuthRequired
        Cors:
          AllowOrigins: [!Ref FrontendOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type, authorization]

  # ---------- "Files are scanned" emails (D.9, backend/api/notify.py) ----------
  # Same code as the API (it reuses the scan ingest), on a schedule. Only exists when NotifyFrom is set.
  NotifyFunction:
    Type: AWS::Serverless::Function
    Condition: NotifyOn
    Properties:
      CodeUri: ../backend/api
      Handler: notify.main
      Timeout: 120
      Environment:
        Variables:
          BUCKET_NAME: !Ref FilesBucket
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
          NOTIFY_FROM: !Ref NotifyFrom
          NOTIFY_FALLBACK_TO: !Ref NotifyFallbackTo
          APP_URL: !Sub "${FrontendOrigin}${FrontendBasePath}"
      Policies:
        - S3CrudPolicy: { BucketName: !Ref FilesBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LegalHoldsTable }
        - Statement:
            - Effect: Allow
              Action: [s3:PutObjectRetention] # scoring a scan can lock records (D.7), same as the API
              Resource: !Sub "${FilesBucket.Arn}/records/*"
            - Effect: Allow
              Action: [macie2:ListClassificationJobs, macie2:ListFindings, macie2:GetFindings]
              Resource: "*"
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

  # Starts the sensitive-data scan once uploads settle, even if nobody keeps the Upload page open (F.25)
  AutoScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/api
      Handler: autoscan.main
      Timeout: 120
      Environment:
        Variables:
          BUCKET_NAME: !Ref FilesBucket
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
          ACCOUNT_ID: !Ref AWS::AccountId # Macie CreateClassificationJob needs it
      Policies:
        - S3CrudPolicy: { BucketName: !Ref FilesBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LegalHoldsTable }
        - Statement:
            - Effect: Allow
              Action: [s3:PutObjectRetention] # scoring a scan can lock records (D.7), same as the API
              Resource: !Sub "${FilesBucket.Arn}/records/*"
            - Effect: Allow
              Action:
                - macie2:CreateClassificationJob
                - macie2:ListClassificationJobs
                - macie2:ListFindings
                - macie2:GetFindings
              Resource: "*"
      Events:
        EveryTwoMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)

  # ---------- Sign-in (docs/login.md) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema: # sign-up asks for name (a standard attribute) and firm (custom:firm), see frontend/src/pages/Auth.tsx
        - Name: firm
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "1", MaxLength: "128" }
        # Which workspace the user belongs to: people in one workspace see the same files. Set only by the
        # sign-up trigger or admin scripts; the web client can't write it (WriteAttributes below).
        - Name: workspace
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "1", MaxLength: "64" }
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SignUpAllowed, false, true] # AllowSignUp parameter
      AccountRecoverySetting: # "Forgot password" codes go to the verified email (never SMS; there's no phone)
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}" # sign-in page host prefix, globally unique
      UserPoolId: !Ref UserPool

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false # browser app: no secret
      # The app's own sign-in forms (frontend/src/auth) talk to Cognito directly: SRP keeps the password
      # off the wire, refresh tokens keep people signed in. The OAuth settings below are kept for SSO later.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED # sign-in and password reset don't reveal which emails have accounts
      # What the browser may set on its own account. custom:workspace is left out on purpose: otherwise a user
      # could move themselves into another firm's workspace and read its files.
      WriteAttributes: [email, name, custom:firm]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - FrontendIsLocalhost
        - ["http://localhost:5173/"]
        - [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]
      LogoutURLs: !If
        - FrontendIsLocalhost
        - ["http://localhost:5173/"]
        - [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  SignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/signup
      Handler: handler.main
      Timeout: 5 # Cognito waits at most 5 s for a trigger
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminAddUserToGroup, cognito-idp:AdminUpdateUserAttributes]
              # Wildcard pool: naming UserPool here would be circular (the pool already points at this function)
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
      Events:
        PostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  AdvisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: advisor, UserPoolId: !Ref UserPool, Description: Works on their workspace's files }
  ComplianceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: compliance, UserPoolId: !Ref UserPool, Description: Compliance tasks in their workspace (same files as everyone there) }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: admin, UserPoolId: !Ref UserPool, Description: Runs their own workspace }
  PlatformGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: platform, UserPoolId: !Ref UserPool, Description: ShredSafe operator; system-wide routes across all workspaces }

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Frontend VITE_COGNITO_CLIENT_ID
    Value: !Ref WebClient
  CognitoAuthority:
    Description: Frontend VITE_COGNITO_AUTHORITY (OIDC issuer)
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoDomain:
    Description: Frontend VITE_COGNITO_DOMAIN (sign-in and sign-out pages)
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  ApiUrl:
    Description: Put this in the frontend's VITE_API_URL
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref FilesBucket
  FilesTableName:
    Value: !Ref FilesTable
  RetentionRulesTableName:
    Value: !Ref RetentionRulesTable
  LegalHoldsTableName:
    Value: !Ref LegalHoldsTable
  AuditLogTableName:
    Value: !Ref AuditLogTable
