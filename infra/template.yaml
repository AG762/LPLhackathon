AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ShredSafe hackathon stack (S3, Lambda, DynamoDB; Bedrock + Macie via IAM)

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin allowed by CORS (Vite dev server by default)
  QuarantineDays:
    Type: Number
    Default: 1
    Description: Grace period before quarantined files are purged (short for the demo)
  DemoControls:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enables POST /audit/demo/tamper and /restore for rehearsing the tamper demo. The Function URL has no auth, so turn this on only for the demo stack (see samconfig.toml).
  FrontendBasePath:
    Type: String
    Default: /
    Description: Path the app is served under, e.g. /ports/5173/ in the online VS Code. With FrontendOrigin it forms the sign-in redirect URL, which Cognito matches exactly.
  AuthRequired:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, every API call needs a Cognito sign-in token (docs/login.md). Off keeps the demo advisor and accepts tokens if sent.
  AllowSignUp:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Anyone can create an account on the sign-in page (independent advisors). New accounts become advisors and see only their own files. false = invite-only (scripts/create_user.py).

Conditions:
  SignUpAllowed: !Equals [!Ref AllowSignUp, "true"]
  FrontendIsLocalhost: !Equals [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512

Resources:
  # ---------- Storage ----------

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Built from a string (not !Ref'd by the functions) so the S3 -> process
      # trigger doesn't create a circular dependency.
      BucketName: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
      # Object Lock can only be turned on when the bucket is created, and it
      # requires versioning. No default retention: records/ objects get
      # per-object retention when they are locked (STORIES.md D.7).
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Grace period: quarantined files expire, then their old versions are removed.
          - Id: purge-quarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: !Ref QuarantineDays
            NoncurrentVersionExpirationInDays: 1
          # Versioning keeps a hidden copy when a file is "moved" (copy + delete)
          # out of uploads/. Remove those copies so deletion is real.
          - Id: purge-old-upload-versions
            Status: Enabled
            Prefix: uploads/
            NoncurrentVersionExpirationInDays: 1
          - Id: cleanup-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: fileId, AttributeType: S }]
      KeySchema: [{ AttributeName: fileId, KeyType: HASH }]

  RetentionRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: docType, AttributeType: S }]
      KeySchema: [{ AttributeName: docType, KeyType: HASH }]

  LegalHoldsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: holdId, AttributeType: S }]
      KeySchema: [{ AttributeName: holdId, KeyType: HASH }]

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: seq, AttributeType: N }]
      KeySchema: [{ AttributeName: seq, KeyType: HASH }]

  # ---------- Functions ----------

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/process
      Handler: handler.process_file_event
      Timeout: 120 # Bedrock reading a multi-page PDF can take a while
      Environment:
        Variables:
          BUCKET_NAME: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-files-${AWS::AccountId}"
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LegalHoldsTable }
        - Statement:
            - Effect: Allow
              # If the Bedrock Mantle client is rejected with AccessDenied,
              # check the exact action it needs in the error message and add it here.
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref FilesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/api
      Handler: handler.main
      Environment:
        Variables:
          BUCKET_NAME: !Ref FilesBucket
          FILES_TABLE: !Ref FilesTable
          RULES_TABLE: !Ref RetentionRulesTable
          HOLDS_TABLE: !Ref LegalHoldsTable
          AUDIT_TABLE: !Ref AuditLogTable
          ACCOUNT_ID: !Ref AWS::AccountId # Macie CreateClassificationJob needs it
          QUARANTINE_DAYS: !Ref QuarantineDays
          DEMO_CONTROLS: !Ref DemoControls
          AUTH_REQUIRED: !Ref AuthRequired
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref WebClient
      Policies:
        - S3CrudPolicy: { BucketName: !Ref FilesBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref FilesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref RetentionRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LegalHoldsTable }
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObjectRetention # locking files in records/ (D.7)
              Resource: !Sub "${FilesBucket.Arn}/records/*"
            # Purge (D.4) deletes every stored version; S3CrudPolicy only covers the current one.
            # Not records/: locked records stay undeletable.
            - Effect: Allow
              Action:
                - s3:ListBucketVersions
              Resource: !GetAtt FilesBucket.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObjectVersion
              Resource:
                - !Sub "${FilesBucket.Arn}/uploads/*"
                - !Sub "${FilesBucket.Arn}/quarantine/*"
                - !Sub "${FilesBucket.Arn}/restored/*"
            - Effect: Allow
              Action:
                - macie2:CreateClassificationJob
                - macie2:DescribeClassificationJob
                - macie2:ListClassificationJobs
                - macie2:ListFindings
                - macie2:GetFindings
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE # sign-in is checked in code (backend/api/auth.py), see AuthRequired
        Cors:
          AllowOrigins: [!Ref FrontendOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type, authorization]

  # ---------- Sign-in (docs/login.md) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SignUpAllowed, false, true] # AllowSignUp parameter
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}" # sign-in page host prefix, globally unique
      UserPoolId: !Ref UserPool

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false # browser app: authorization code + PKCE, no secret
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - FrontendIsLocalhost
        - ["http://localhost:5173/"]
        - [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]
      LogoutURLs: !If
        - FrontendIsLocalhost
        - ["http://localhost:5173/"]
        - [!Sub "${FrontendOrigin}${FrontendBasePath}", "http://localhost:5173/"]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  # Cognito's sign-in / sign-up page in the app's colours. Cognito only accepts its own *-customizable
  # classes and a short list of properties (a wrong one fails the deploy), so this sticks to the
  # properties in AWS's example stylesheet. Applies to the classic hosted UI (ManagedLoginVersion 1).
  SignInPageStyle:
    Type: AWS::Cognito::UserPoolUICustomizationAttachment
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      CSS: >-
        .background-customizable { background-color: #f3f4f6; }
        .banner-customizable { padding: 24px 0px 18px 0px; background-color: #0a0e14; }
        .label-customizable { font-weight: 600; color: #0a0e14; }
        .textDescription-customizable { padding-top: 10px; padding-bottom: 10px; display: block; font-size: 15px; color: #4b5563; }
        .inputField-customizable { width: 100%; height: 44px; color: #0a0e14; background-color: #ffffff; border-color: #c9ced6; }
        .inputField-customizable:focus { border-color: #3d5a86; outline-color: #3d5a86; }
        .submitButton-customizable { font-size: 15px; font-weight: 600; margin: 20px 0px 0px 0px; height: 46px; width: 100%; color: #ffffff; background-color: #0a0e14; }
        .submitButton-customizable:hover { color: #ffffff; background-color: #1d2633; }
        .errorMessage-customizable { padding: 10px; margin: 10px 0px; font-size: 14px; width: 100%; color: #b42318; border: 1px solid #f3c7c2; background-color: #fdf1f0; }
        .redirect-customizable { text-align: center; }
        .legalText-customizable { color: #6b7280; font-size: 12px; }
        .passwordCheck-notValid-customizable { color: #b42318; }
        .passwordCheck-valid-customizable { color: #3d5a86; }

  SignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/signup
      Handler: handler.main
      Timeout: 5 # Cognito waits at most 5 s for a trigger
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # Wildcard pool: naming UserPool here would be circular (the pool already points at this function)
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
      Events:
        PostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  AdvisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: advisor, UserPoolId: !Ref UserPool, Description: Own files only }
  ComplianceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: compliance, UserPoolId: !Ref UserPool, Description: All files; runs Macie scans }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: admin, UserPoolId: !Ref UserPool, Description: Demo controls and system actions }

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Frontend VITE_COGNITO_CLIENT_ID
    Value: !Ref WebClient
  CognitoAuthority:
    Description: Frontend VITE_COGNITO_AUTHORITY (OIDC issuer)
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoDomain:
    Description: Frontend VITE_COGNITO_DOMAIN (sign-in and sign-out pages)
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  ApiUrl:
    Description: Put this in the frontend's VITE_API_URL
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref FilesBucket
  FilesTableName:
    Value: !Ref FilesTable
  RetentionRulesTableName:
    Value: !Ref RetentionRulesTable
  LegalHoldsTableName:
    Value: !Ref LegalHoldsTable
  AuditLogTableName:
    Value: !Ref AuditLogTable
